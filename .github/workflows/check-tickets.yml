name: Check UZ tickets
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
concurrency:
  group: check-uz-tickets
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: python check_once.py
      - name: Commit updated dedup state
        run: |
          if [ ! -f state.json ]; then
            echo "ERROR: check_once.py did not create state.json"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state.json
          if git diff --staged --quiet; then
            echo "state.json has not changed"
          else
            git commit -m "chore: update dedup state [skip ci]"
            git push
          fi